name: snapshot-diario

"on":
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: python -m pip install -r trend-report/requirements.txt

      - name: Capturar RSS de México
        working-directory: trend-report
        run: python3 -m src.snapshot --geo MX

      - name: Publicar snapshot si cambió
        run: |
          git config user.name "trends-bot"
          git config user.email "bot@users.noreply.github.com"
          git add trend-report/data/snapshots/
          git diff --cached --quiet && echo "sin cambios" || {
            git commit -m "chore: snapshot trends $(date -u +%F)"
            git push
          }
