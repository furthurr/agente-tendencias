proyecto:
  nombre: Agente de Informes Semanales de Tendencias
  version: 0.1.0
  geo_default: MX
  idioma: es
  user_agent: "AgenteTendencias/0.1 (+https://github.com/tu-usuario/agente-tendencias)"

periodos:
  semana:
    etiqueta: Semana
    dias_actual: 7
    dias_base: 21
  mes:
    etiqueta: Mes
    dias_actual: 30
    dias_base: 90
  anio:
    etiqueta: Año
    dias_actual: 365
    dias_base: 365

http:
  timeout: 25
  retries: 2
  backoff_inicial: 1.0
  sleep_entre_fuentes: 0.35

fuentes:
  wikipedia:
    sleep_segundos: 0.35
    max_lookup: 800
    stop_fallos_consecutivos: 6
    dias_minimos_recomendados: 25
  youtube:
    sleep_segundos: 0.38
    max_sugerencias_por_semilla: 8
  hackernews:
    points_minimos: 50
    max_historias: 60
  gdelt:
    sleep_segundos: 2.0

scoring:
  min_temas_nicho: 3
  top_nichos: 3
  top_temas: 5
  top_miembros_nicho: 8
  trending:
    wiki: 0.45
    rss: 0.25
    yt: 0.20
    hn: 0.10
  growth:
    crecimiento: 0.65
    tamano: 0.35
  tema:
    trending: 0.60
    growth: 0.40

